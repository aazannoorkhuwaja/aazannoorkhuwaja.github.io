# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["post"]

[header]
  layout = "basic"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"
  showRecent = false
  showRecentItems = 3
  showMoreLink = false

[article]
  showDate = true
  showAuthor = true
  showHero = false
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = true
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true
  showCards = true
  groupByYear = true
  cardView = true

[author]
  name = "Aazan Noor Khuwaja"
  image = "img/avatar.png"
  headline = "Computer Science @ FAST-NUCES · Software Systems, AI & Open Source"
  bio = "I build practical systems — from transaction-safe pharmacy software and ML-based intrusion detection to cross-platform browser tooling."

[sitemap]
  excludedKinds = ["taxonomy", "term"]
