# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = false
enableCodeCopy = true

mainSections = ["post"]

[header]
  layout = "clean"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom"
  showRecent = false
  showRecentItems = 3
  showMoreLink = false

[article]
  showDate = true
  showAuthor = false
  showHero = false
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = false
  showTaxonomies = true
  showWordCount = false
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true
  showCards = true
  groupByYear = true
  cardView = true

[author]
  name = "Aazan Noor Khuwaja"
  image = "img/avatar.png"
  headline = "Computer Science @ FAST-NUCES Karachi · 5th Semester"
  bio = "I build practical software systems across databases, AI/ML, and developer tooling, and I document what I learn along the way."

[sitemap]
  excludedKinds = ["taxonomy", "term"]
