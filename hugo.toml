baseurl = "https://aazannoorkhuwaja.github.io/"
title = "Aazan Noor Khuwaja"
theme = "blowfish"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Portfolio content is authored in this repository and uses small HTML
      # structures for proof/credential cards.
      unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[Permalinks]
  post = "/:contentbasename/"
