<div class="portfolio-mobile-menu">
  <input type="checkbox" id="mobile-menu-toggle" autocomplete="off" class="portfolio-mobile-toggle">

  <label for="mobile-menu-toggle" class="portfolio-mobile-trigger" aria-label="Open navigation menu">
    {{ partial "icon.html" "bars" }}
  </label>

  <div class="portfolio-mobile-panel" role="dialog" aria-modal="true" aria-label="Site navigation">
    <div class="portfolio-mobile-panel-inner">
      <div class="portfolio-mobile-panel-head">
        <a href="{{ "" | relLangURL }}" class="portfolio-mobile-brand" aria-label="{{ .Site.Title }} home">
          {{ partial "brand/mark.html" (dict "class" "portfolio-mobile-brand-mark") }}
          <span>{{ .Site.Title | markdownify }}</span>
        </a>
        <label for="mobile-menu-toggle" class="portfolio-mobile-close" aria-label="Close navigation menu">
          {{ partial "icon.html" "xmark" }}
        </label>
      </div>

      <nav class="portfolio-mobile-links" aria-label="Mobile navigation">
        {{ range .Site.Menus.main }}
          <a
            href="{{ .URL }}"
            {{ if or (strings.HasPrefix .URL "http:") (strings.HasPrefix .URL "https:") }}target="_blank" rel="noopener noreferrer"{{ end }}>
            {{ .Name | markdownify }}
          </a>
        {{ end }}
      </nav>

      {{ if .Site.Params.footer.showAppearanceSwitcher | default false }}
        <div class="portfolio-mobile-appearance">
          <span>Appearance</span>
          <button id="appearance-switcher-mobile" type="button" aria-label="Toggle color theme" title="Toggle color theme" class="portfolio-mobile-theme-toggle">
            <span class="portfolio-theme-icon portfolio-theme-icon-moon">{{ partial "icon.html" "moon" }}</span>
            <span class="portfolio-theme-icon portfolio-theme-icon-sun">{{ partial "icon.html" "sun" }}</span>
          </button>
        </div>
      {{ end }}
    </div>
  </div>
</div>
