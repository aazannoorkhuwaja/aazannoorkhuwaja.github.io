<div class="mobile-menu-shell">
  <input type="checkbox" id="mobile-menu-toggle" autocomplete="off" class="mobile-menu-toggle" aria-hidden="true">

  <label for="mobile-menu-toggle" class="mobile-menu-trigger" aria-label="Open navigation menu">
    {{ partial "icon.html" "bars" }}
  </label>

  <div role="dialog" aria-modal="true" aria-label="Site navigation" class="mobile-menu-dialog">
    <div class="mobile-menu-panel">
      <div class="mobile-menu-topbar">
        <a href="{{ "" | relLangURL }}" class="mobile-menu-brand" aria-label="{{ .Site.Title }} home">
          {{ .Site.Title | markdownify }}
        </a>
        <label for="mobile-menu-toggle" class="mobile-menu-close" aria-label="Close navigation menu">
          {{ partial "icon.html" "xmark" }}
        </label>
      </div>

      <nav class="mobile-menu-links" aria-label="Mobile navigation">
        {{ range .Site.Menus.main }}
          <a
            href="{{ .URL }}"
            {{ if or (strings.HasPrefix .URL "http:") (strings.HasPrefix .URL "https:") }}target="_blank" rel="noopener noreferrer"{{ end }}>
            {{ .Name | markdownify }}
          </a>
        {{ end }}
      </nav>

      {{ if .Site.Params.footer.showAppearanceSwitcher | default false }}
        <div class="mobile-menu-appearance">
          <span>Appearance</span>
          <button id="appearance-switcher-mobile" type="button" aria-label="Toggle color theme" title="Toggle color theme">
            <span class="theme-icon theme-icon-moon">{{ partial "icon.html" "moon" }}</span>
            <span class="theme-icon theme-icon-sun">{{ partial "icon.html" "sun" }}</span>
          </button>
        </div>
      {{ end }}
    </div>
  </div>
</div>
