<script>
  (function () {
    const root = document.documentElement;
    const coarseQuery = window.matchMedia('(pointer: coarse)');
    const anyCoarseQuery = window.matchMedia('(any-pointer: coarse)');

    function syncCompactUI() {
      const inner = window.innerWidth || 1024;
      const visual = window.visualViewport && window.visualViewport.width ? window.visualViewport.width : inner;
      const screenWidth = window.screen && window.screen.width ? window.screen.width : inner;
      const screenHeight = window.screen && window.screen.height ? window.screen.height : inner;
      const shortSide = Math.min(screenWidth, screenHeight);
      const effectiveWidth = Math.min(inner, visual, screenWidth || inner);
      const coarse = coarseQuery.matches || anyCoarseQuery.matches;
      const compact = effectiveWidth <= 899 || (coarse && shortSide <= 700);

      root.dataset.compactUi = compact ? 'true' : 'false';
      if (compact) {
        const heroSize = Math.max(38, Math.min(52, effectiveWidth * 0.115));
        root.style.setProperty('--compact-hero-size', heroSize + 'px');
      } else {
        root.style.removeProperty('--compact-hero-size');
      }
    }

    syncCompactUI();
    window.addEventListener('resize', syncCompactUI, { passive: true });
    window.addEventListener('orientationchange', syncCompactUI, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', syncCompactUI, { passive: true });
  })();
</script>
